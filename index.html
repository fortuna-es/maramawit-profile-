<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maramawit Addis Meseret - Profile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .banner {
      height: 90px;
      background: linear-gradient(135deg, #2563eb, #1e40af);
    }
    .avatar-wrapper {
      margin-top: -60px;
      margin-bottom: 12px;
      display: inline-block;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      background: #e2e8f0;
      display: block;
    }
    .content {
      padding: 0 24px 24px 24px;
    }
    h1 {
      font-size: 19px;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 16px;
    }
    .details {
      background: #f8fafc;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      text-align: left;
      border: 1px solid #e2e8f0;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid #f1f5f9;
    }
    .row:last-child {
      border-bottom: none;
    }
    .label {
      color: #64748b;
      font-weight: 500;
    }
    .val {
      color: #0f172a;
      font-weight: 600;
    }
    .call-btn {
      display: block;
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .call-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="banner"></div>
    <div class="content">
      <div class="avatar-wrapper">
        <img class="avatar" src="photo.jpg" alt="Maramawit Addis Meseret">
      </div>
      <h1>Maramawit Addis Meseret</h1>
      <p class="tagline">Personal Profile &amp; Contact</p>

      <div class="details">
        <div class="row">
          <span class="label">Age</span>
          <span class="val">18</span>
        </div>
        <div class="row">
          <span class="label">Gender</span>
          <span class="val">Female</span>
        </div>
        <div class="row">
          <span class="label">Address</span>
          <span class="val">Burayu, Ethiopia</span>
        </div>
        <div class="row">
          <span class="label">Phone</span>
          <span class="val">+251 71 244 5684</span>
        </div>
      </div>

      <a class="call-btn" href="tel:+251712445684">Call +251 71 244 5684</a>
    </div>
  </div>

</body>
</html>
